# BLE advertising sniffer variant (USB transport).
#   west build -b promicro_nrf52840/nrf52840 platforms/zephyr -- -DEXTRA_CONF_FILE=overlay-sniff.conf
# The radio is driven directly, so the BLE controller must stay off (BT=n,
# the default for the USB build) and nothing else may claim the radio.
CONFIG_DUTA_SNIFF=y
