# nRF52840 DK — bring up the USB device stack + a CDC ACM port for the mux link,
# and the interrupt-driven UART API that cdc-acm needs.
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Duta nRF52840"
CONFIG_USB_DEVICE_VID=0x1209
CONFIG_USB_DEVICE_PID=0x5d10
CONFIG_USB_CDC_ACM=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_REBOOT=y
CONFIG_GPIO=y
