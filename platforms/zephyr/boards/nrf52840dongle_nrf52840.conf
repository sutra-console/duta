# nRF52840 Dongle — same USB CDC ACM mux link as the DK. The dongle ships with a
# UF2/Open bootloader, so REBOOT(bootloader) drops straight back into DFU.
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Duta nRF52840 dongle"
CONFIG_USB_DEVICE_VID=0x1209
CONFIG_USB_DEVICE_PID=0x5d10
CONFIG_USB_CDC_ACM=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_REBOOT=y
CONFIG_GPIO=y
