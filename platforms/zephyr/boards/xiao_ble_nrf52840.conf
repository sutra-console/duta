# Seeed XIAO nRF52840 (Zephyr board xiao_ble) — USB device stack + a CDC ACM port
# for the mux link, plus the interrupt-driven UART API cdc-acm needs. Mirrors the
# promicro nRF52840 config (same SoC, same UF2 bootloader, same USB-console hazard).
CONFIG_USB_DEVICE_STACK=y
# Use the legacy USB stack (main.c does); the next stack would double-claim the
# cdc_acm node.
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_USB_DEVICE_PRODUCT="Duta XIAO nRF52840"
CONFIG_USB_DEVICE_VID=0x1209
CONFIG_USB_DEVICE_PID=0x5d12
CONFIG_USB_CDC_ACM=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_REBOOT=y
CONFIG_GPIO=y
CONFIG_ADC=y # ADC inputs 0/1 — VDD (Supply) + VDDHDIV5 (Battery, ×5); see the overlay

# Flashing is drag-and-drop onto the UF2 bootloader drive, so emit zephyr.uf2.
CONFIG_BUILD_OUTPUT_UF2=y

# The Duta mux OWNS the link, so no console backend may share it: any console
# byte would corrupt the skrit stream. Silence it; main.c brings USB up itself.
CONFIG_UART_CONSOLE=n
