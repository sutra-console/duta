# Pro Micro nRF52840 (nice!nano v2 compatible) — USB CDC ACM port for the mux
# link, on the NEW device_next USB stack (the board's native choice).
#
# We migrated off the legacy CONFIG_USB_DEVICE_STACK: on this board its CDC ACM
# never delivered RX interrupts (host->device dead, so the host got no CMD
# responses) while TX worked. device_next services RX correctly. main.c brings
# the device up itself (VID/PID/strings in code), so disable the board's
# auto-init to avoid double-claiming the cdc_acm node.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
# cdc-acm needs the interrupt-driven UART API + line control (DTR/baud).
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_REBOOT=y
CONFIG_GPIO=y
CONFIG_ADC=y # ADC inputs 0/1 — VDD (Supply) + VDDHDIV5 (Battery, ×5); see the overlay

# No debug header on these boards — flashing is drag-and-drop onto the UF2
# bootloader drive, so emit build/zephyr/zephyr.uf2.
CONFIG_BUILD_OUTPUT_UF2=y

# This board routes its system console to the USB CDC by default — but the Duta
# mux OWNS that pipe, so any console/printk byte would corrupt the skrit stream
# (same hazard as CORE_DEBUG_LEVEL=0 on the ESP32). Keep the console off the CDC.
CONFIG_UART_CONSOLE=n
