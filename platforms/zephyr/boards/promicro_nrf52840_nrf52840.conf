# Pro Micro nRF52840 (nice!nano v2 compatible) — USB device stack + a CDC ACM
# port for the mux link, plus the interrupt-driven UART API cdc-acm needs.
CONFIG_USB_DEVICE_STACK=y
# The board defconfig enables the NEW USB stack (device_next) for its CDC
# console; main.c uses the legacy stack — both at once double-claim the
# cdc_acm node and break the link.
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_USB_DEVICE_PRODUCT="Duta Pro Micro nRF52840"
CONFIG_USB_DEVICE_VID=0x1209
CONFIG_USB_DEVICE_PID=0x5d11
CONFIG_USB_CDC_ACM=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_REBOOT=y
CONFIG_GPIO=y
CONFIG_ADC=y # ADC input 0 — internal VDD (mV); see the overlay's zephyr,user node

# No debug header on these boards — flashing is drag-and-drop onto the UF2
# bootloader drive, so emit build/zephyr/zephyr.uf2.
CONFIG_BUILD_OUTPUT_UF2=y

# This board routes its system console to the USB CDC by default — but the Duta
# mux OWNS that pipe, so any console/printk byte would corrupt the skrit stream
# (same hazard as CORE_DEBUG_LEVEL=0 on the ESP32). Silence the console backend;
# main.c brings USB up itself (a redundant auto-init just returns -EALREADY).
CONFIG_UART_CONSOLE=n
