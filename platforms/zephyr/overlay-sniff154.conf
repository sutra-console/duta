# IEEE 802.15.4 (Zigbee/Thread) sniffer variant (USB transport).
#   west build -b promicro_nrf52840/nrf52840 platforms/zephyr -- -DEXTRA_CONF_FILE=overlay-sniff154.conf
# The radio is driven directly in 802.15.4 mode, so the BLE controller must stay
# off (BT=n, the default for the USB build) and nothing else may claim the radio.
CONFIG_DUTA_SNIFF_154=y
# 802.15.4 records are large (up to ~137 B) and the enlarged send buffers push
# the main stack — give it headroom (the default is too tight for this path).
CONFIG_MAIN_STACK_SIZE=4096
