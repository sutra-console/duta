# BLE transport overlay — carries the skrit-mux stream over a Nordic UART Service
# (NUS) GATT pipe instead of USB CDC. Build with:
#
#   west build -b nrf52840dk/nrf52840 platforms/zephyr -- -DEXTRA_CONF_FILE=overlay-ble.conf
#
# CONFIG_BT makes src/main.c select the BLE transport (see the #if CONFIG_BT block).
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Duta nRF52840"
CONFIG_BT_DEVICE_APPEARANCE=0

# GATT server with our hand-rolled NUS service (BT_GATT_SERVICE_DEFINE).
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_ATT_PREPARE_COUNT=2

# Larger ATT MTU so console bursts need fewer notifications.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251

# Security: LE Secure Connections pairing (ECDH P-256) so the air link is
# encrypted and NOT passively sniffable. A Duta has no display/keyboard, so the
# IO capability is NoInputNoOutput → "Just Works" pairing (encrypted, passively
# secure under LESC). The DATA/CMD characteristics require encryption, so a central
# must pair before it can write or subscribe.
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y

# Persist bonds across reboots: the settings subsystem over NVS on the flash map,
# so a paired host reconnects without re-pairing.
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# Per-device identity: set the advertised name to Duta-XXXX (from the BLE address)
# at runtime, so multiple Dutas are distinguishable in a scan.
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=24

# Keep the DATA-UART bridge + outputs + reboot from the base config.
CONFIG_SERIAL=y
CONFIG_GPIO=y
CONFIG_REBOOT=y
