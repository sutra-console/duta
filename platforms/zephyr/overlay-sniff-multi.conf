# Unified runtime-switchable sniffer (BLE + IEEE 802.15.4), USB transport.
#   west build -b promicro_nrf52840/nrf52840 platforms/zephyr -- -DEXTRA_CONF_FILE=overlay-sniff-multi.conf
# Both raw-radio backends are compiled in and dispatched through a vtable; the
# host switches the live PHY at runtime with CFG_SET key 0x14 (DATA kind):
#   4 = BLE advertising · 7 = IEEE 802.15.4 (Zigbee / Thread / Matter-over-Thread)
# The radio is driven directly, so the BLE controller must stay off (BT=n, the
# default for the USB build). Boots in BLE mode.
CONFIG_DUTA_SNIFF_MULTI=y
# Carries the 802.15.4 backend (records up to ~137 B) — give the main stack the
# same headroom the single-154 build uses.
CONFIG_MAIN_STACK_SIZE=4096
