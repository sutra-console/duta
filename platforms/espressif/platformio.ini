; Duta on ESP32 (Arduino / PlatformIO).
;   pio run -e esp32s3            build the ESP32-S3 (default)
;   pio run -e esp32s3 -t upload  flash it
;   pio run                       builds the default env
;
; All envs share the portable core in ../common and the skrit contract in
; ../../protocol (wired via build_flags). DATA rides a hardware UART; DATA + CMD
; are multiplexed over the single USB-CDC (skrit-mux). See README.md.
[platformio]
default_envs = esp32s3

[env]
framework = arduino
; NOTE: ${platformio.include_dir} (= <project>/include) interpolates to an
; ABSOLUTE path at ini-parse time. ${PROJECT_DIR} must not be used in -I flags:
; recent espressif32 builders rebase the unexpanded string against the platform
; package dir, silently pointing the includes into ~/.platformio.
build_flags =
    -I${platformio.include_dir}/../../../protocol
    -I${platformio.include_dir}/../../common
    ; silence core logs — on native-USB boards the console IS the mux link,
    ; so any log line pollutes the skrit stream
    -DCORE_DEBUG_LEVEL=0
; addressable-RGB output (onboard WS2812). Pinned: 3.10+ adds an audio module
; that fails to compile against the arduino-esp32 3.x IDF headers.
lib_deps = fastled/FastLED@3.9.13
monitor_speed = 115200

; ESP32-S3 — native USB-CDC carries the mux link.
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32S3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Waveshare ESP32-S3-Zero — S3FH4R2 (4MB flash / 2MB PSRAM), native USB-C
; carries the mux link; the silkscreened TX/RX (GP43/44) are the DATA bridge.
[env:s3zero]
platform = espressif32
board = esp32-s3-devkitc-1 ; closest stock def; 4MB overrides below
board_upload.flash_size = 4MB
board_build.flash_mode = qio
; the DevKitC def assumes 8MB — without this the partition table points past
; the S3-Zero's 4MB flash and the bootloader refuses to boot (boot loop)
board_build.partitions = default.csv
build_flags =
    ${env.build_flags}
    -DBOARD_S3_ZERO
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Waveshare ESP32-S3-Zero, BLE-sniffer variant — DATA becomes captured BLE
; advertising (controller passive scan) via the portable duta_sniffer.h facade.
; WiFi is compiled out; the BLE stack needs a big app, so huge_app (single 3MB
; app, no OTA) instead of the dual-OTA default.csv.
[env:s3zeroble]
platform = espressif32
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.flash_mode = qio
board_build.partitions = huge_app.csv
build_flags =
    ${env.build_flags}
    -DBOARD_S3_ZERO
    -DDUTA_SNIFF_BLE_ESP
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Waveshare ESP32-S3-Zero, BLE *transport* variant — the ESP32 is a connectable,
; pairing Duta peripheral (the two skrit GATT services, LESC pairing/bonding,
; encrypted) instead of being reached over USB/WiFi. WiFi compiled out; the BLE
; stack needs a big app, so huge_app (single 3MB app, no OTA).
[env:s3zeroblelink]
platform = espressif32
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.flash_mode = qio
board_build.partitions = huge_app.csv
build_flags =
    ${env.build_flags}
    -DBOARD_S3_ZERO
    -DDUTA_BLE_TRANSPORT
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Waveshare ESP32-S3-Zero on the HYBRID framework (ESP-IDF + Arduino-as-component).
; Same source as [env:s3zero] — this just proves the IDF base builds it, and is
; where modules get peeled to pure IDF (BLE→NimBLE, RGB→led_strip, …) incrementally.
; The pure-Arduino [env:s3zero] stays as the fallback.
[env:s3zero_idf]
platform = espressif32
framework = arduino, espidf
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.flash_mode = qio
board_build.partitions = parts_4mb.csv ; real CSV file (IDF can't resolve the Arduino built-in name)
; Drop arduino-esp32's bundled extras Duta never uses (modem, dsp, speech, modbus,
; mp3) — pioarduino's mechanism for trimming managed idf components. One of them
; transitively pulls esp-serial-flasher, which doesn't compile here; removing them
; fixes the build and shrinks it.
custom_component_remove =
    espressif/esp_modem
    espressif/esp-dsp
    espressif/esp-sr
    espressif/esp-modbus
    chmorgan/esp-libhelix-mp3
    espressif/esp_hosted
    espressif/esp_wifi_remote
    espressif/esp-zboss-lib
    espressif/esp-zigbee-lib
    espressif/esp_rainmaker
    espressif/rmaker_common
    espressif/esp_insights
    espressif/esp_diagnostics
    espressif/esp_diag_data_store
    espressif/qrcode
build_flags =
    ${env.build_flags}
    -DBOARD_S3_ZERO
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Waveshare ESP32-S3-Zero on PURE ESP-IDF (no Arduino) — the IDF-native firmware
; in main_idf.c: USB-Serial/JTAG mux link, UART1 DATA bridge, GPIO/LEDC/RMT-WS2812
; outputs, reboot. WiFi/WS + runtime provisioning are still the Arduino build's job.
[env:s3zero_pureidf]
platform = espressif32
framework = espidf
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.flash_mode = qio
board_build.partitions = parts_4mb.csv
lib_deps = ; no FastLED — RGB is driven via the RMT WS2812 driver
custom_component_add = espressif/mdns ; _skrit._tcp advertisement (managed component)
custom_sdkconfig =
    CONFIG_ESP_CONSOLE_NONE=y ; free the USB-Serial/JTAG for the mux link (the console IS the link)
build_flags =
    ${env.build_flags}
    -DBOARD_S3_ZERO
    -DDUTA_PURE_IDF

; ESP32-C6-DevKitC-1 — RISC-V, WiFi 6 + BLE + 802.15.4. Pure-IDF mux on the C6's
; native USB-Serial/JTAG; DATA on U0 (GPIO16/17 -> the DevKitC-1's CH343 port).
; 4MB table is safe on the N8 module (uses the first 4MB).
[env:esp32c6]
platform = espressif32
framework = espidf
board = esp32-c6-devkitc-1
board_upload.flash_size = 4MB
board_build.flash_mode = qio
board_build.partitions = parts_4mb.csv
custom_component_add = espressif/mdns ; _skrit._tcp advertisement (managed component)
custom_sdkconfig =
    CONFIG_ESP_CONSOLE_NONE=y ; the USB-Serial/JTAG IS the mux link
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32C6
    -DDUTA_PURE_IDF

; ESP32-C6 IEEE 802.15.4 sniffer+injector — the "dumb radio" for Zigbee/Thread.
; DATA becomes captured 802.15.4 frames (DATA_DESC = ieee802154); a host DATA
; write injects a raw MAC frame; PROTO value = channel (11-26, 0=auto-hop). All
; the Zigbee intelligence is host-side (Sutra) — see the network-model plan.
[env:esp32c6_sniff154]
platform = espressif32
framework = espidf
board = esp32-c6-devkitc-1
board_upload.flash_size = 4MB
board_build.flash_mode = qio
board_build.partitions = parts_4mb.csv
custom_component_add = espressif/mdns
custom_sdkconfig =
    CONFIG_ESP_CONSOLE_NONE=y ; the USB-Serial/JTAG IS the mux link
    CONFIG_IEEE802154_ENABLED=y ; bring in the 802.15.4 radio driver
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32C6
    -DDUTA_PURE_IDF
    -DDUTA_SNIFF_ESP154

; ESP32-C3 — also native USB-CDC.
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32C3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Seeed XIAO ESP32-S3 — native USB-CDC carries the mux; DATA on the silkscreened
; TX/RX (U0, GPIO43/44). Uses the stock board def (8MB flash / PSRAM handled).
[env:xiaos3]
platform = espressif32
board = seeed_xiao_esp32s3
build_flags =
    ${env.build_flags}
    -DBOARD_XIAO_S3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Seeed XIAO ESP32-C3 — native USB-CDC; DATA on the silkscreened TX/RX (U0,
; GPIO21/20).
[env:xiaoc3]
platform = espressif32
board = seeed_xiao_esp32c3
build_flags =
    ${env.build_flags}
    -DBOARD_XIAO_C3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Classic ESP32 — no native USB; the mux link rides UART0 (the CP2102 bridge).
[env:esp32]
platform = espressif32
board = esp32dev
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32
