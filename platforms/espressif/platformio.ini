; Duta on ESP32 (Arduino / PlatformIO).
;   pio run -e esp32s3            build the ESP32-S3 (default)
;   pio run -e esp32s3 -t upload  flash it
;   pio run                       builds the default env
;
; All envs share the portable core in ../common and the skrit contract in
; ../../protocol (wired via build_flags). DATA rides a hardware UART; DATA + CMD
; are multiplexed over the single USB-CDC (skrit-mux). See README.md.
[platformio]
default_envs = esp32s3

[env]
framework = arduino
; NOTE: ${platformio.include_dir} (= <project>/include) interpolates to an
; ABSOLUTE path at ini-parse time. ${PROJECT_DIR} must not be used in -I flags:
; recent espressif32 builders rebase the unexpanded string against the platform
; package dir, silently pointing the includes into ~/.platformio.
build_flags =
    -I${platformio.include_dir}/../../../protocol
    -I${platformio.include_dir}/../../common
; addressable-RGB output (onboard WS2812). Pinned: 3.10+ adds an audio module
; that fails to compile against the arduino-esp32 3.x IDF headers.
lib_deps = fastled/FastLED@3.9.13
monitor_speed = 115200

; ESP32-S3 — native USB-CDC carries the mux link.
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32S3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Waveshare ESP32-S3-Zero — S3FH4R2 (4MB flash / 2MB PSRAM), native USB-C
; carries the mux link; the silkscreened TX/RX (GP43/44) are the DATA bridge.
[env:s3zero]
platform = espressif32
board = esp32-s3-devkitc-1 ; closest stock def; 4MB overrides below
board_upload.flash_size = 4MB
board_build.flash_mode = qio
; the DevKitC def assumes 8MB — without this the partition table points past
; the S3-Zero's 4MB flash and the bootloader refuses to boot (boot loop)
board_build.partitions = default.csv
build_flags =
    ${env.build_flags}
    -DBOARD_S3_ZERO
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32-C3 — also native USB-CDC.
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32C3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Classic ESP32 — no native USB; the mux link rides UART0 (the CP2102 bridge).
[env:esp32]
platform = espressif32
board = esp32dev
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32
