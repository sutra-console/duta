; Duta on ESP32 (Arduino / PlatformIO).
;   pio run -e esp32s3            build the ESP32-S3 (default)
;   pio run -e esp32s3 -t upload  flash it
;   pio run                       builds the default env
;
; All envs share the portable core in ../common and the skrit contract in
; ../../protocol (wired via build_flags). DATA rides a hardware UART; DATA + CMD
; are multiplexed over the single USB-CDC (skrit-mux). See README.md.
[platformio]
default_envs = esp32s3

[env]
framework = arduino
build_flags =
    -I${PROJECT_DIR}/../../protocol
    -I${PROJECT_DIR}/../common
lib_deps = fastled/FastLED@^3.7.0 ; addressable-RGB output (onboard WS2812)
monitor_speed = 115200

; ESP32-S3 — native USB-CDC carries the mux link.
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32S3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32-C3 — also native USB-CDC.
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32C3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Classic ESP32 — no native USB; the mux link rides UART0 (the CP2102 bridge).
[env:esp32]
platform = espressif32
board = esp32dev
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32
