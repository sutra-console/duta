; Duta on ESP32 (Arduino / PlatformIO). Build: `pio run`
[platformio]
default_envs = esp32c3

[env]
framework = arduino
build_flags = -I${PROJECT_DIR}/../../protocol
monitor_speed = 115200

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1

[env:esp32]
platform = espressif32
board = esp32dev
