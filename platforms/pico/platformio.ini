; Duta on Raspberry Pi Pico / Pico 2 (Arduino / PlatformIO).
;   pio run -e pico              build the Pico / RP2040 (default)
;   pio run -e pico -t upload    flash it
;   pio run -e pico2 -t upload   build + flash the Pico 2 / RP2350
;   pio run                      builds the default env
;
; Both envs use the earlephilhower arduino-pico core (best TinyUSB + RP2350
; support) and share the portable core in ../common and the skrit contract in
; ../../protocol (wired via build_flags). DATA rides UART0 (Serial1); DATA + CMD
; are multiplexed over the single native USB-CDC (skrit-mux). See README.md.
[platformio]
default_envs = pico

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board_build.core = earlephilhower
; ${platformio.include_dir} interpolates to an ABSOLUTE path at ini-parse time;
; ${PROJECT_DIR} in -I flags breaks under builders that rebase unexpanded paths
; (see the espressif platformio.ini note).
build_flags =
    -I${platformio.include_dir}/../../../protocol
    -I${platformio.include_dir}/../../common
monitor_speed = 115200

; Raspberry Pi Pico — RP2040, native USB-CDC carries the mux link.
[env:pico]
board = rpipico
build_flags =
    ${env.build_flags}
    -DBOARD_PICO

; Raspberry Pi Pico 2 — RP2350, also native USB-CDC.
[env:pico2]
board = rpipico2
build_flags =
    ${env.build_flags}
    -DBOARD_PICO2

; Seeed XIAO RP2040 — RP2040, native USB-C carries the mux; DATA on the
; silkscreened TX/RX (UART0 GP0/GP1).
[env:xiaorp2040]
board = seeed_xiao_rp2040
build_flags =
    ${env.build_flags}
    -DBOARD_XIAO_RP2040
