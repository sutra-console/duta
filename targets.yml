# Duta firmware build targets.
#
# CI builds every target below on push/PR. Fork the repo, add your board here,
# and you inherit the whole build system (the shared core in platforms/common).
# `transport`: how DATA + CMD reach the host — `usb-dual-cdc` = two ports;
# `usb-mux` / `tcp` / `ble` = one channel carrying both via skrit-mux.
targets:
  - platform: ch55xduino
    board: weact_ch552
    define: BOARD_WEACT_CH552
    fqbn: CH55xDuino:mcs51:ch552:usb_settings=user266
    transport: usb-dual-cdc

  - platform: ch55xduino
    board: generic_ch552
    define: BOARD_GENERIC_CH552
    fqbn: CH55xDuino:mcs51:ch552:usb_settings=user266
    transport: usb-dual-cdc

  - platform: espressif
    board: esp32-s3-devkitc-1
    env: esp32s3
    transport: usb-mux

  - platform: espressif
    board: waveshare-esp32-s3-zero
    env: s3zero
    transport: usb-mux

  - platform: espressif
    board: esp32-c3-devkitm-1
    env: esp32c3
    transport: usb-mux

  - platform: espressif
    board: esp32dev
    env: esp32
    transport: usb-mux

  - platform: espressif
    board: seeed_xiao_esp32s3
    env: xiaos3
    transport: usb-mux

  - platform: espressif
    board: seeed_xiao_esp32c3
    env: xiaoc3
    transport: usb-mux

  - platform: pico
    board: rpipico
    env: pico
    transport: usb-mux

  - platform: pico
    board: rpipico2
    env: pico2
    transport: usb-mux

  - platform: pico
    board: seeed_xiao_rp2040
    env: xiaorp2040
    transport: usb-mux

  - platform: zephyr
    board: nrf52840dk/nrf52840
    transport: usb-mux

  - platform: zephyr
    board: nrf52840dongle/nrf52840
    transport: usb-mux

  - platform: zephyr
    board: promicro_nrf52840/nrf52840 # nice!nano v2 / SuperMini clones
    transport: usb-mux

  - platform: zephyr
    board: xiao_ble/nrf52840 # Seeed XIAO nRF52840 (and Sense)
    transport: usb-mux

  - platform: zephyr
    board: native_sim
    transport: build-check

  - platform: host
    board: native
    transport: websocket
