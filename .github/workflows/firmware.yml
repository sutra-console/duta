name: firmware

on:
  push:
    paths: ["platforms/**", "protocol/**", "targets.yml", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["platforms/**", "protocol/**", "targets.yml", ".github/workflows/firmware.yml"]
  workflow_dispatch:

jobs:
  # ---- vendored protocol must match the canonical skrit repo ----
  protocol-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Diff against sutra-console/skrit @ main
        run: |
          git clone --depth 1 https://github.com/sutra-console/skrit /tmp/skrit
          diff -u /tmp/skrit/protocol.h protocol/protocol.h
          diff -u /tmp/skrit/PROTOCOL.md protocol/PROTOCOL.md
          echo "vendored protocol/ is in sync with skrit@main"

  # ---- shared core: hardware-free protocol/VM/mux tests, must pass ----
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build + run the core test (mock HAL)
        run: |
          cc -std=c11 -Wall -Wextra \
            -I platforms/common -I protocol \
            platforms/common/test_core.c -o /tmp/test_core
          /tmp/test_core
      - name: Build + run the table-driven IO test (mock Arduino)
        run: |
          c++ -std=c++17 -Wall -Wextra \
            -I platforms/common/test -I platforms/common -I protocol \
            platforms/common/test/test_io.cpp -o /tmp/test_io
          /tmp/test_io

  # ---- CH55x: the authoritative dual-CDC firmware build ----
  ch55xduino:
    runs-on: ubuntu-latest
    env:
      CH55X_URL: https://raw.githubusercontent.com/DeqingSun/ch55xduino/ch55xduino/package_ch55xduino_mcs51_index.json
    steps:
      - uses: actions/checkout@v5
      - name: Install arduino-cli 1.0.4
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh -s 1.0.4
          echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: Install CH55xDuino core
        run: |
          arduino-cli core update-index --additional-urls "$CH55X_URL"
          arduino-cli core install CH55xDuino:mcs51 --additional-urls "$CH55X_URL"
      - name: Compile (WeAct CH552, default board)
        run: |
          arduino-cli compile \
            --fqbn "CH55xDuino:mcs51:ch552:usb_settings=user266" \
            --warnings none \
            platforms/ch55xduino

  # ---- host/native reference (WebSocket): hardware-free, must build + test ----
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cmake -B platforms/host/build platforms/host
      - run: cmake --build platforms/host/build
      - run: ctest --test-dir platforms/host/build --output-on-failure

  # ---- ESP32 family (Arduino/PlatformIO) ----
  espressif:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [esp32s3, esp32c3, esp32]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: pip install --upgrade platformio
      - run: pio run -d platforms/espressif -e ${{ matrix.env }}

  # ---- Raspberry Pi Pico / Pico 2 (arduino-pico / PlatformIO) ----
  pico:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [pico, pico2]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: pip install --upgrade platformio
      - run: pio run -d platforms/pico -e ${{ matrix.env }}

  # ---- Zephyr: native_sim (must pass) + nRF52840 DK ----
  zephyr:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board: [native_sim, nrf52840dk/nrf52840]
    steps:
      - uses: actions/checkout@v5
        with:
          path: duta
      # west.yml lives at the repo root, so `west init -l duta` makes the runner
      # workspace the west topdir (what this action requires for `west update`).
      - uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: duta
          manifest-file-name: west.yml
          toolchains: all
      - run: west build -b ${{ matrix.board }} duta/platforms/zephyr
        working-directory: ${{ github.workspace }}

  # ---- Zephyr BLE (NUS) build-check — scaffold, allowed to fail until it's
  #      validated on hardware (BT module/API specifics may need a tweak) ----
  zephyr-ble:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          path: duta
      - uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: duta
          manifest-file-name: west.yml
          toolchains: all
      - run: >
          west build -b nrf52840dk/nrf52840 duta/platforms/zephyr
          -- -DEXTRA_CONF_FILE=overlay-ble.conf
        working-directory: ${{ github.workspace }}
