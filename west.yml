# Minimal west manifest so CI (and a fresh checkout) can resolve Zephyr.
# Lives at the repo root so `west init -l` makes the checkout parent the
# workspace topdir (what action-zephyr-setup expects); the app itself is
# platforms/zephyr.
# Inside an existing Zephyr workspace you don't need this — just `west build`.
manifest:
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.2.0 # pinned so CI doesn't chase main; bump deliberately
      import:
        # Keep the CI clone lean — native_sim + nRF52840 (USB and BLE) need
        # these; tinycrypt/mbedtls back the BT host's crypto.
        name-allowlist:
          - cmsis
          - cmsis_6
          - hal_nordic
          - picolibc
          - tinycrypt
          - mbedtls
  self:
    path: duta
